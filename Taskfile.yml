# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PROJECT_NAME: chronicle
  APP_VERSION: "0.8.0" # x-release-please-version

  DEFAULT_IMAGE_NAME: "{{.PROJECT_NAME}}:{{.APP_VERSION}}"
  # podman or docker
  CONTAINER_ENGINE: '{{.CONTAINER_ENGINE | default "podman"}}'
  # `podman compose` hands over to docker-compose, which talks to Podman's API socket.
  COMPOSE_SOCKET: '{{if eq .CONTAINER_ENGINE "podman"}}systemctl --user start podman.socket && {{end}}'
  # Playable scenarios: what project:check tests.
  SCENARIOS: cost-of-disease fear-of-the-unknown a-time-of-war the-thinning-veil
  # Scenarios written as text (content/<id>/src), built by tools/scenario-author.
  AUTHORED: the-thinning-veil

tasks:
  # Dependencies
  deps:install:
    desc: Install all workspace dependencies (npm ci in CI).
    sources: ["package.json", "package-lock.json", "*/package.json"]
    generates: ["node_modules/.package-lock.json"]
    cmds:
      - '{{if .CI}}npm ci{{else}}npm install{{end}}'

  # Docker
  project:build:docker:
    desc: Build the production image.
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default .DEFAULT_IMAGE_NAME}}'
    sources: ["Containerfile", "docker/**/*", "package-lock.json", "engine/**/*", "frontend/**/*", "content/**/*"]
    generates: [.docker_image_marker.lock]
    cmds:
      # Podman's default OCI format drops HEALTHCHECK; the docker format keeps it.
      - "{{.CONTAINER_ENGINE}} build --file Containerfile {{if eq .CONTAINER_ENGINE \"podman\"}}--format docker {{end}}--tag {{.IMAGE_NAME}} --target runtime ."
      - touch .docker_image_marker.lock

  project:up:prod:
    desc: "Run the production image locally with Podman, or CONTAINER_ENGINE=docker (vars: PORT, default 8080)."
    deps:
      - task: project:build:docker
    cmd: '{{.COMPOSE_SOCKET}}IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" PORT="{{.PORT | default "8080"}}" {{.CONTAINER_ENGINE}} compose up -d'

  project:down:prod:
    desc: Stop the locally running production container.
    cmd: '{{.COMPOSE_SOCKET}}IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" {{.CONTAINER_ENGINE}} compose down'

  # Project
  project:check:
    desc: "Everything CI checks: types, lint and formatting, unit tests, app build, voice script up to date, story tester."
    deps: [deps:install]
    cmds:
      - npx tsc -b
      - task: frontend:lint
      - npm test
      - task: frontend:test
      - task: frontend:build
      - task: content:voices:script
        vars: { CLI_ARGS: --check }
      - for: { var: AUTHORED }
        cmd: node tools/scenario-author/src/cli.ts {{.ITEM}} --check
      - for: { var: SCENARIOS }
        task: content:test
        vars: { ID: '{{.ITEM}}' }

  # Frontend
  frontend:content:
    internal: true
    desc: Copy the content the app serves (scenario data, texts in every language, screen texts, assets, changelog) into frontend/public/content (git-ignored).
    sources: ["content/*/scenario.json", "content/*/strings.*.json", "content/*/extras.json", "content/ui.*.json", "content/assets/**/*", "CHANGELOG.md"]
    generates: ["frontend/public/content/**/*"]
    cmds:
      - rm -rf frontend/public/content
      - mkdir -p frontend/public/content
      - for f in content/*/scenario.json content/*/strings.*.json content/*/extras.json; do mkdir -p "frontend/public/$(dirname "$f")" && cp "$f" "frontend/public/$f"; done
      - cp content/ui.*.json frontend/public/content/
      - cp -r content/assets frontend/public/content/
      # The app's "What's new" page reads it, also offline.
      - cp CHANGELOG.md frontend/public/content/changelog.md

  frontend:serve:dev:
    desc: Serve the app with live reload (ng serve).
    deps: [deps:install, frontend:content]
    dir: frontend
    cmd: npx ng serve

  frontend:build:
    desc: "Production build into build/web (BASE_HREF: path the app is served under, e.g. /chronicle/)."

    deps: [deps:install, frontend:content]
    dir: frontend
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default (joinPath .ROOT_DIR "build/web")}}'
      BASE_HREF: '{{.BASE_HREF | default "/"}}'
    label: frontend:build:{{.BASE_HREF}}
    sources: ["src/**/*", "public/**/*", "angular.json", "ngsw-config.json", "../engine/src/**/*.ts", "../package-lock.json"]
    generates: ["{{.OUTPUT_DIR}}/browser/index.html"]
    cmd: npx ng build --configuration=production --output-path="{{.OUTPUT_DIR}}" --base-href="{{.BASE_HREF}}"

  frontend:lint:
    desc: "Lint the app (ESLint, also its templates) and check its formatting (Prettier; FIX=true to fix both)."
    deps: [deps:install]
    dir: frontend
    cmds:
      - npx eslint src {{if .FIX}}--fix{{end}}
      - npx prettier {{if .FIX}}--write{{else}}--check{{end}} "src/**/*.{ts,html,css}" eslint.config.js

  frontend:test:
    desc: Unit tests of the app (Vitest).
    deps: [deps:install]
    dir: frontend
    cmd: npx ng test --watch=false

  frontend:e2e:
    desc: "Play a whole game of each scenario in headless Chrome against the production build (CHROME_PATH, SHOTS=<dir> for screenshots, SCENARIO=<id> for one)."
    deps: [frontend:build]
    cmd: node tools/e2e/src/full-game.ts --build build/web/browser {{if .SHOTS}}--shots {{.SHOTS}}{{end}} {{if .SCENARIO}}--scenario {{.SCENARIO}}{{end}}

  # Content
  content:voices:
    desc: "Generated voice-over with Kokoro (needs uv and ffmpeg; settings in tools/voice/voices.json). CLI_ARGS: passages, --voices emma,george, --try \"any text\""
    cmd: uv run -q tools/voice/generate.py {{.CLI_ARGS}}

  content:voices:gpu:
    desc: "Generated voice-over with Chatterbox (the Italian voices) in a Docker container with the NVIDIA GPU. CLI_ARGS as content:voices, e.g. -- --scenario cost-of-disease --voices sara,nicola"
    cmd: >-
      docker run --rm --gpus all -v "{{.ROOT_DIR}}:/work" -v "$HOME/.cache/huggingface:/root/.cache/huggingface"
      -v chronicle-pip:/root/.cache/pip -w /work python:3.12-slim sh -c
      "apt-get update -qq && apt-get install -y -qq ffmpeg
      && pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu124
      && pip install -q chatterbox-tts==0.1.7 && python tools/voice/generate.py {{.CLI_ARGS}}"

  content:voices:script:
    desc: "Voice actor's script of the voiced pages, from strings.en.json into content/voice-script/ (committed; -- --check fails while it is out of date)."
    cmd: python3 tools/voice/script.py {{.CLI_ARGS}}

  content:build:
    desc: "Build a scenario written as text (content/<ID>/src/*.story) into its scenario.json, extras and string tables."
    vars:
      ID: '{{.ID | default "the-thinning-veil"}}'
    cmd: node tools/scenario-author/src/cli.ts {{.ID}}

  content:test:
    desc: "Story tester: static checks + coverage-guided exploration, spoiler-free summary (vars: ID, SECONDS; CLI_ARGS e.g. -- --spoilers)."
    deps: [deps:install]
    vars:
      ID: '{{.ID | default "cost-of-disease"}}'
      SECONDS: '{{.SECONDS | default "120"}}'
    cmd: node tools/story-tester/src/cli.ts {{.ID}} --seconds {{.SECONDS}} {{.CLI_ARGS}}
